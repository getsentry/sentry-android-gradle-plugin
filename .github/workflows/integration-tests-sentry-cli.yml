name: integration-tests-sentry-cli

on:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  integration-test:
    runs-on: ubuntu-latest
    env:
      # sentry-cli 3.6.2+ ignores an auth token when the URL comes from a different
      # configuration source, so the URL and token must share one source. CLI arguments
      # and environment variables count as a single runtime source, so both live here.
      SENTRY_URL: http://127.0.0.1:8000
      SENTRY_AUTH_TOKEN: <token>
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.14.7'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92 # pin@v6
        with:
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}

      - name: Set up Java
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Start server and run integration test for sentry-cli commands
        run: |
          test/integration-test-server-start.sh &
          ./gradlew -p plugin-build integrationTest --tests "*IntegrationTest"
