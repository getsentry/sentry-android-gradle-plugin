name: Update Test Matrix

# Regenerates the AGP/Gradle/Kotlin versions that test-matrix-agp-gradle.yaml runs, and opens a PR
# when they change, so new versions are tested in that PR before they land on main.
on:
  schedule:
    - cron: '0 4 * * *'
  workflow_dispatch:

permissions:
  contents: read

env:
  MATRIX_FILE: .github/test-matrix-agp-gradle.json

jobs:
  generate:
    name: Generate Compat Matrix
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Generate Compat Matrix
        run: kotlin scripts/generate-compat-matrix.main.kts --output "$MATRIX_FILE"

      - name: Upload Compat Matrix
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: test-matrix
          path: ${{ env.MATRIX_FILE }}
          include-hidden-files: true

  # Separate from `generate`, so the write token never shares a runner with the third-party
  # dependencies that the generator script downloads.
  create-pr:
    name: Create PR
    needs: generate
    runs-on: ubuntu-latest
    steps:
      # A GITHUB_TOKEN-created PR would not trigger the Test Matrix and other required checks.
      - name: Get auth token
        id: token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ vars.SENTRY_RELEASE_BOT_CLIENT_ID }}
          private-key: ${{ secrets.SENTRY_RELEASE_BOT_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write

      - name: Checkout Repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download Compat Matrix
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: test-matrix
          path: .github

      - name: Validate Compat Matrix
        run: jq -e '.include | length > 0' "$MATRIX_FILE"

      - name: Create or update PR
        uses: peter-evans/create-pull-request@3ffccacd46053766916f087ce41d627c0b8cf2d1 # v8.1.3
        with:
          token: ${{ steps.token.outputs.token }}
          branch: deps/test-matrix-agp-gradle
          delete-branch: true
          add-paths: ${{ env.MATRIX_FILE }}
          commit-message: 'chore(deps): Update AGP/Gradle test matrix'
          title: 'chore(deps): Update AGP/Gradle test matrix'
          body: |
            Updates `${{ env.MATRIX_FILE }}` to the latest AGP, Gradle, and Kotlin versions, generated by `scripts/generate-compat-matrix.main.kts`.

            #skip-changelog
          labels: dependencies
