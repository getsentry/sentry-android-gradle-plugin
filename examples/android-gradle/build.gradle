plugins {
  id("com.android.application")
  id("io.sentry.android.gradle")
}

def agpVersion = BuildPluginsVersion.AGP.split('\\.')
def agpMajor = agpVersion[0].toInteger()
def agpMinor = agpVersion[1].toInteger()
def supportsOptimizationDsl = agpMajor > 9 || (agpMajor == 9 && agpMinor >= 3)

android {
  compileSdk = LibsVersion.SDK_VERSION
  defaultConfig {
    minSdk = LibsVersion.MIN_SDK_VERSION
    targetSdk = LibsVersion.SDK_VERSION
    versionCode = 1
    versionName = "1.0"
  }
  buildTypes {
    release {
      if (supportsOptimizationDsl) {
        minifyEnabled false
        optimization {
          enable = true
        }
      } else {
        minifyEnabled true
      }
      proguardFiles getDefaultProguardFile(
        'proguard-android-optimize.txt')
    }
  }
  namespace = 'com.example.sampleapp'
}

sentry {
  autoUploadProguardMapping = CI.INSTANCE.canAutoUpload()

  telemetryDsn = CI.INSTANCE.SENTRY_SDKS_DSN
  tracingInstrumentation {
      enabled = false
  }
}
